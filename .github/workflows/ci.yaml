name: ci-wf
on:
  push:
    branches:
      - develop
  pull_request: 
    branches:
      - develop
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Weclome Message
        run: echo "Allah Please Help Me"
      - name: Clone The Repository
        uses: actions/checkout@v4
      - name: Repository Information
        run: |
          echo "Repository Name: ${{github.repository}}"
          echo "Branch That Triggered The Workflow: ${{github.ref}}"
          echo "User Who Caused The Workflow Run: ${{github.actor}}"   
          git -v
          git branch
          git branch feature/temp
          git switch feature/temp
          touch temp.html temp1.html temp2.html
          git ls-files
          git add .
          git ls-files --stage
          git config --local user.name "Imran Ashraf"
          git config --local user.email zsain.ucp@gmail.com
          git commit -m "Add temp Files"
          git ls-tree HEAD
          git branch -a
          git config --local --list
          echo "Current Working Directory"
          pwd
          echo "List the Development Environments"
          echo "Java Runtime"
          java --version
          echo ".NET Runtime"
          dotnet --version
          dotnet --list-sdks
          node -v
          npm -v
      - name: Use Of Linters Below
        run: echo "____________________"
      - name: Install  HTML Linter
        run: npm install -g prettier
      - name: Install CSS Linter
        run: npm install -g stylelint
      - name: Install HTMLHint
        run: npm install -g stylehint 
      - name: Lint HTML Using HTMLHint
        run: npx htmlhint "**/*.html"
