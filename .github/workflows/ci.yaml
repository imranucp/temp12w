name: ci-wf
on:
  push:
    branches:
      - develop
  pull_request: 
    branches:
      - develop
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Weclome Message
        run: echo "Allah Please Help Me"
      - name: Clone The Repository
        uses: actions/checkout@v4
      - name: Repository Information
        run: |
          echo "Repository Name: ${{github.repository}}"
          ehco "Repository Name: $GITHUB_REPOSITORY"
          echo "Branch That Triggered The Workflow: ${{github.ref}}"
          echo "Branch That Triggered The Workflow: $GITHUB_REF"
          echo "User Who Caused The Workflow Run: ${{github.actor}}"
          echo "User Who Caused The Workflow Rub:$GITHUB_ACTOR"